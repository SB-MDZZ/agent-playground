name: smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: deliberately failing check
        run: |
          echo "this check always fails so the agent has a CI event to react to"
          exit 1
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: second deliberately failing check
        run: |
          echo "second failing check"
          exit 1
